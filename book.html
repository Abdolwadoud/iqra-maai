<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تفاصيل الكتاب — مكتبة اقرأ معي</title><meta name="description" id="md" content="تفاصيل الكتاب في مكتبة اقرأ معي.">
<link rel="icon" href="assets/logo-blue.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"><link rel="stylesheet" href="style.css"></head>
<body><div id="hdr"></div><main class="w" id="m"><div class="msg">جارٍ التحميل…</div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>(async()=>{const s=await settings();chrome(s);const id=new URLSearchParams(location.search).get("id");
const{data:b}=/^[0-9a-f-]{36}$/.test(id||"")?await sb.from("books").select(BSEL).eq("id",id).eq("is_published",true).maybeSingle():{data:null};
if(!b){$("#m").innerHTML='<div class="msg">الكتاب غير موجود. <a href="books.html">العودة إلى الكتب</a></div>';return}
document.title=b.title+" — "+s.library_name;$("#md").content=(b.description||b.title).slice(0,150);
const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
const p=b.sale_price!=null?mru(b.sale_price)+(b.price!=null?` (بدلًا من ${mru(b.price)})`:""):b.price!=null?mru(b.price):"";
$("#m").innerHTML=`<div class="det"><img src="${esc(b.cover_image_url||PH)}" alt="غلاف كتاب ${esc(b.title)}"><div><h1 style="color:var(--ink);font-size:30px;margin:0">${esc(b.title)}</h1><dl>${row("المؤلف",b.author)}${row("الناشر",b.publisher)}${row("ISBN",b.isbn)}${row("التصنيف",b.categories?.name)}${row("اللغة",b.language)}${row("عدد الصفحات",b.pages)}${row("السعر",p)}<dt>التوفر</dt><dd class="st ${b.availability_status}">${AV[b.availability_status]}</dd></dl>${b.description?`<p>${esc(b.description)}</p>`:""}${b.whatsapp_enabled?`<a class="btn w2" target="_blank" rel="noopener" href="${wa(s.whatsapp,`السلام عليكم، أود الاستفسار عن توفر كتاب ${b.title} لدى ${s.library_name}.`)}">استفسر عبر واتساب</a>`:""}<p class="m">الاستفسار ليس طلب شراء، وتؤكد المكتبة التوفر والسعر.</p></div></div><h2>كتب مشابهة</h2><div class="grid" id="sim"></div>`;
if(b.category_id){const{data}=await sb.from("books").select(BSEL).eq("is_published",true).eq("category_id",b.category_id).neq("id",b.id).limit(4);$("#sim").innerHTML=(data||[]).map(x=>card(x,s)).join("")||'<div class="msg">لا توجد كتب مشابهة بعد.</div>'}
const j=document.createElement("script");j.type="application/ld+json";j.text=JSON.stringify({"@context":"https://schema.org","@type":"Book",name:b.title,...(b.author?{author:{"@type":"Person",name:b.author}}:{}),...(b.isbn?{isbn:b.isbn}:{})});document.head.appendChild(j)})();</script></body></html>
