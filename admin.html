<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المكتبة</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:850px;margin:30px auto;padding:18px}.panel{border:1px solid var(--line);padding:22px;border-radius:16px;margin:20px 0}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field textarea{min-height:80px}.notice{background:#fff3cd;padding:12px;border-radius:10px}.submit{border:0;margin-top:12px;cursor:pointer}</style></head><body><header><a class="brand" href="index.html"><img src="assets/logo.svg" alt=""><span>مكتبة <b>اقرأ معي</b><small>لوحة الإدارة</small></span></a><a class="btn" href="index.html">عرض الموقع</a></header><main class="wrap"><h1>لوحة إدارة المكتبة</h1><p class="notice">هذه نسخة تجريبية تحفظ البيانات في المتصفح الحالي فقط. ليست لوحة إدارة آمنة أو مشتركة؛ اربطي Supabase Auth وقاعدة بيانات محمية قبل الاستخدام الحقيقي.</p><section class="panel"><h2>إضافة كتاب</h2><form id="book-form"><div class="form"><label class="field">عنوان الكتاب<input name="title" required></label><label class="field">المؤلف<input name="author"></label><label class="field">التصنيف<input name="category"></label><label class="field">غلاف الكتاب<input name="cover" type="file" accept="image/*"></label></div><label class="field">الوصف<textarea name="description"></textarea></label><button class="btn submit">حفظ الكتاب</button></form><div id="books"></div></section><section class="panel"><h2>إضافة إعلان</h2><form id="ad-form"><div class="form"><label class="field">عنوان الإعلان<input name="title" required></label><label class="field">صورة الإعلان<input name="image" type="file" accept="image/*"></label></div><label class="field">نص الإعلان<textarea name="text"></textarea></label><label><input type="checkbox" name="active" checked> إعلان نشط</label><button class="btn submit">حفظ الإعلان</button></form><div id="ads"></div></section></main><script src="admin.js"></script></body></html>
